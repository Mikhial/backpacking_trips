# Trail maps, in two steps:
#   1. download-parks.js saves each park's map data and elevation in parkdata/ (not published).
#      Only parks that don't have saved data yet are downloaded.
#   2. build-maps.js builds each trip's map in assets/trails/ from that saved data.
# Then it commits both and republishes the site.
# Runs whenever a trip, a GPX route or the map scripts change. Can also be run by hand from the Actions tab.
name: Fetch trail maps

on:
  push:
    paths: ['trips/*.md', 'tracks/**', 'scripts/download-parks.js', 'scripts/build-maps.js', 'lib/parkdata.js', 'lib/geo.js']
  workflow_dispatch:
    inputs:
      california:
        description: Redo all California parks (from the California map file)
        type: boolean
        default: false
      park:
        description: Or refresh one park (trip or park name, e.g. zion)
        type: string
        default: ''

permissions:
  contents: write
  actions: write

concurrency:
  group: trail-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install osmium
        if: inputs.california
        run: sudo apt-get update && sudo apt-get install -y osmium-tool
      - name: Download park data
        run: node scripts/download-parks.js ${{ inputs.california && '--california' || '' }} ${{ inputs.park && format('--force {0}', inputs.park) || '' }}
      - name: Build trip maps
        run: node scripts/build-maps.js
      - name: Commit changes
        id: commit
        run: |
          git add -A parkdata assets/trails
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update trail map data"
          git pull --rebase
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Republish the site
        if: steps.commit.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
